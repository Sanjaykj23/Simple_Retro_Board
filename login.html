<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Simple Retro Board</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      color: #e0e0e0;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 50px 40px;
      width: 380px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      text-align: center;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #00ffcc, #00d4aa);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #000;
      font-size: 20px;
      box-shadow: 0 0 15px rgba(0,255,204,0.7);
    }

    .login-card h2 {
      margin-bottom: 30px;
      font-size: 22px;
      font-weight: 600;
      color: #00ffcc;
      text-shadow: 0 0 8px rgba(0,255,204,0.7);
    }

    .login-card input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 14px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .login-card input:focus {
      border-color: #00ffcc;
      box-shadow: 0 0 10px rgba(0,255,204,0.6);
      outline: none;
    }

    .login-card input::placeholder {
      color: #aaa;
    }

    .login-card button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #00ffcc, #00d4aa);
      color: #000;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .login-card button:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 15px rgba(0,255,204,0.5);
    }

    .login-card p {
      margin-top: 25px;
      font-size: 13px;
      color: #ccc;
    }

    .login-card a {
      color: #00ffcc;
      text-decoration: none;
      font-weight: 500;
    }

    .login-card a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-card" id="loginForm">
    <div class="logo">SR</div>
    <h2>Simple Retro Board</h2>
    <form>
      <input type="text" placeholder="Username" required id="username"/>
      <input type="password" placeholder="Password" required id="password"/>
      <button type="submit">Login</button>
    </form>
    <p>No account? <a href="./register.html">Sign up</a></p>
  </div>
</body>
<script>
  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const users = JSON.parse(localStorage.getItem("users")) || [];

    const validUser = users.find(u => u.username === username && u.password === password);

    if (validUser) {
      localStorage.setItem("loggedInUser", JSON.stringify(validUser));
      window.location.href = "index.html";
    } else {
      alert("Invalid credentials!");
    }
  });
</script>
</html>
