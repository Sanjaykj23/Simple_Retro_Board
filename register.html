<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Simple Retro Board</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
      color: #e0e0e0;
    }

    .register-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 40px;
      width: 420px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .register-card h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 22px;
      font-weight: 600;
      color: #00ffcc;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
      color: #b0b0b0;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-group input:focus {
      border-color: #00ffcc;
      box-shadow: 0 0 6px rgba(0,255,204,0.6);
      outline: none;
    }

    .form-group input::placeholder {
      color: #888;
    }

    .register-card button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background-color: #00ffcc;
      color: #000;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .register-card button:hover {
      background-color: #00d4aa;
      transform: translateY(-2px);
    }

    .register-card p {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #aaa;
    }

    .register-card a {
      color: #00ffcc;
      text-decoration: none;
      font-weight: 500;
    }

    .register-card a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="register-card">
    <h2>Create Your Account</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="teamname">Team name</label>
        <input type="text" id="teamname" placeholder="Choose a Team name" required />
      </div>
      <div class="form-group">
        <label for="username">User name</label>
        <input type="text" id="username" placeholder="Choose a username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required />
      </div>
      <div class="form-group">
        <label for="role">Role</label>
        <input type="text" id="role" placeholder="Enter your role" required />
      </div>
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="./login.html">Login here</a></p>
  </div>

</body>
<script>
document.querySelector("form").addEventListener("submit", function(e) {
  e.preventDefault();

  const teamName = document.getElementById("teamname").value;
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const role = document.getElementById("role").value;

  let users = JSON.parse(localStorage.getItem("users")) || [];

  // Check if username already exists
  const existing = users.find(u => u.username === username);
  if (existing) {
    alert("Username already exists!");
    return;
  }

  const newUser = { teamName, username, password, role };
  users.push(newUser);
  localStorage.setItem("users", JSON.stringify(users));

  alert("Registration successful!");
  window.location.href = "login.html";
});
</script>
</html>
