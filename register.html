<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Simple Retro Board</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .register-glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      color: #fff;
    }

    .register-glass h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 14px;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .form-group input::placeholder {
      color: #eee;
    }

    .form-group input:focus {
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      outline: none;
    }

    .register-glass button {
      width: 100%;
      padding: 12px;
      background-color: #fff;
      color: #333;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .register-glass button:hover {
      background-color: #f0f0f0;
    }

    .register-glass p {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .register-glass a {
      color: #fff;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .register-glass {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="register-glass">
    <h2>Create Your Account</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="teamname">Team name</label>
        <input type="text" id="teamname" placeholder="Choose a Team name" required />
      </div>
      <div class="form-group">
        <label for="username">User name</label>
        <input type="text" id="username" placeholder="Choose a username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required />
      </div>
      <div class="form-group">
        <label for="role">Role </label>
        <input type="text" id="role" placeholder="Enter your role" required />
      </div>
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="./login.html">Login here</a></p>
  </div>

</body>
<script>
document.querySelector("form").addEventListener("submit", function(e) {
  e.preventDefault();

  const teamName = document.getElementById("teamname").value;
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const role = document.getElementById("role").value;

  let users = JSON.parse(localStorage.getItem("users")) || [];

  // Check if username already exists
  const existing = users.find(u => u.username === username);
  if (existing) {
    alert("Username already exists!");
    return;
  }

  const newUser = { teamName, username, password, role };
  users.push(newUser);
  localStorage.setItem("users", JSON.stringify(users));

  alert("Registration successful!");
  window.location.href = "login.html";
});
</script>
</html>
